apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
name: 5-minute-abs
on:
  schedule:
    - cron: 0,5,10,15,20,25,30,35,40,45,50,55 * * * *
  workflow_dispatch:
jobs:
  build:
    steps:
      - name: Say hello
        uses: docker://golang:1.20.3-alpine3.17
        shell: sh
        run: |
          echo "hello world99"
    needs:
      - TestJob
  TestJob:
    steps:
      - name: Test
        with:
          test-type: JUNIT
          results-path: "*.xml"
        uses: cloudbees-io/publish-test-results@v2
